name: ci-windows.yml
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
env:
  CMAKE_BUILD_TYPE: Release
  CMAKE_EXPORT_COMPILE_COMMANDS: true
  BUILD_DIR: build
  CMAKE_PRESET: windows-debug

jobs:
  core-build:
    uses: ./.github/workflows/core-build/windows.yml
    with:
      cmake-build-type: ${{ env.CMAKE_BUILD_TYPE }}
      cmake-preset: ${{ env.CMAKE_PRESET }}
      build-dir: ${{ env.BUILD_DIR }}

  core-test:
    runs-on: windows-latest
    needs: [core-build]

    permissions:
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: core-${{ env.CMAKE_PRESET }}-build
          path: .\${{ env.BUILD_DIR }}

      - name: Run tests
        env:
          UPDATE_TEST_IMAGES: 0
          TEST_PROFILE: windows
        run: |
          Push-Location -Path .\${{ env.BUILD_DIR }}\${{ env.CMAKE_PRESET }}\core\test
          ctest --output-on-failure

  kotlin-test:
    runs-on: windows-latest
    needs: [core-build]

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: core-${{ env.CMAKE_PRESET }}-build
          path: ${{ env.BUILD_DIR }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build Kotlin Bindings
        working-directory: .\languages\kotlin
        run: |
          .\gradlew build

      - name: Build Kotlin Examples
        working-directory: .\examples\kotlin
        run: |
          .\gradlew build

      - name: Run Kotlin Tests
        working-directory: .\languages\kotlin
        run: |
          .\gradlew test

      - name: Rate coverage
        working-directory: .\languages\kotlin
        run: |
          .\gradlew koverPrintCoverage